<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-jacob-darling" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>

    <!-- Teal accent gradient -->
    <linearGradient id="accent-jacob-darling" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#40E0D0;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#40E0D0;stop-opacity:0.3" />
    </linearGradient>

    <!-- Pattern overlay -->
    <pattern id="pattern-jacob-darling" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="60" cy="60" r="2" fill="#40E0D0" opacity="0.1"/>
      <circle cx="0" cy="0" r="1" fill="#FFA500" opacity="0.08"/>
      <circle cx="120" cy="120" r="1" fill="#FFA500" opacity="0.08"/>
    </pattern>

    <!-- Glow effect -->
    <radialGradient id="glow-jacob-darling" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#40E0D0;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#40E0D0;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#40E0D0;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-jacob-darling)"/>

  <!-- Pattern overlay -->
  <rect width="1200" height="630" fill="url(#pattern-jacob-darling)"/>

  <!-- Glow effects -->
  <ellipse cx="200" cy="200" rx="300" ry="300" fill="url(#glow-jacob-darling)"/>
  <ellipse cx="1000" cy="430" rx="250" ry="250" fill="url(#glow-jacob-darling)" opacity="0.6"/>

  <!-- Accent gradient overlay -->
  <rect width="1200" height="630" fill="url(#accent-jacob-darling)" opacity="0.4"/>

  <!-- Decorative geometric shapes -->
  <rect x="80" y="80" width="4" height="120" rx="2" fill="#40E0D0" opacity="0.3"/>
  <rect x="1116" y="430" width="4" height="120" rx="2" fill="#FFA500" opacity="0.3"/>
  <circle cx="150" cy="530" r="60" fill="none" stroke="#40E0D0" stroke-width="2" opacity="0.2"/>
  <circle cx="1050" cy="150" r="80" fill="none" stroke="#FFA500" stroke-width="2" opacity="0.2"/>

  <!-- Main content area -->
  <g transform="translate(100, 240)">
    <!-- Page title -->
    <text
      x="0"
      y="0"
      font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
      font-size="72"
      font-weight="700"
      fill="#40E0D0"
      letter-spacing="-1"
    >Jacob Darling</text>

    
    <!-- Subtitle -->
    <text
      x="0"
      y="90"
      font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
      font-size="36"
      font-weight="400"
      fill="#94a3b8"
      opacity="0.8"
      letter-spacing="0.5"
    >Fractional CMO & Marketing Technologist</text>
    
  </g>

  <!-- Bottom accent line -->
  <line x1="100" y1="570" x2="1100" y2="570" stroke="#40E0D0" stroke-width="3" opacity="0.5"/>

  <!-- Corner accents -->
  <circle cx="100" cy="100" r="8" fill="#40E0D0" opacity="0.4"/>
  <circle cx="1100" cy="100" r="8" fill="#FFA500" opacity="0.4"/>
  <circle cx="100" cy="530" r="8" fill="#FFA500" opacity="0.4"/>
  <circle cx="1100" cy="530" r="8" fill="#40E0D0" opacity="0.4"/>
</svg>