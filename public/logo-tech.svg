<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient: Teal to Orange -->
    <linearGradient id="gradient-cybernetic-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#40E0D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter for interactive effects -->
    <filter id="glow-cybernetic-logo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Status dot glow -->
    <radialGradient id="status-glow-cybernetic-logo" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#40E0D0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#40E0D0;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#40E0D0;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background circle (subtle) -->
  <circle cx="32" cy="32" r="30" fill="#0f172a" opacity="0.3"/>

  <!-- Tech bracket: Opening -->
  <path d="M 12 20 L 12 44 L 18 44 L 18 26 L 16 24 L 12 20 Z" fill="url(#gradient-cybernetic-logo)" opacity="0.6"/>

  <!-- Tech bracket: Closing -->
  <path d="M 52 20 L 52 44 L 46 44 L 46 26 L 48 24 L 52 20 Z" fill="url(#gradient-cybernetic-logo)" opacity="0.6"/>

  <!-- JD Monogram -->
  <g transform="translate(32, 32)">
    <!-- J -->
    <path d="M -8 -12 L -8 8 L -4 8 L -4 4 L 0 4 L 0 0 L -4 0 L -4 -8 L -8 -12 Z" fill="url(#gradient-cybernetic-logo)"/>
    <!-- D -->
    <path d="M 4 -12 L 4 8 L 12 8 L 16 4 L 16 0 L 12 -4 L 16 -8 L 16 -12 L 4 -12 Z M 8 -8 L 8 4 L 12 4 L 14 2 L 14 -2 L 12 -4 L 8 -8 Z" fill="url(#gradient-cybernetic-logo)"/>
  </g>

  <!-- Status dot (top right) -->
  <circle cx="50" cy="14" r="4" fill="#40E0D0" opacity="0.9" filter="url(#glow-cybernetic-logo)">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Status dot inner glow -->
  <circle cx="50" cy="14" r="2" fill="url(#status-glow-cybernetic-logo)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>