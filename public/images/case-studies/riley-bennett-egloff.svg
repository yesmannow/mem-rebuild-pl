<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-riley-bennett-egloff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#16213E;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1A1A2E;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="accent-riley-bennett-egloff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#40E0D0;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="main-riley-bennett-egloff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#16213E;stop-opacity:0.95" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="16" fill="#2D2D44"/>
  
  <!-- Subtle background gradient -->
  <rect width="256" height="256" rx="16" fill="url(#bg-riley-bennett-egloff)"/>
  
  <!-- Main logo container -->
  <rect x="40" y="40" width="176" height="176" rx="20" fill="url(#main-riley-bennett-egloff)"/>
  
  <!-- Professional accent border -->
  <rect x="40" y="40" width="176" height="176" rx="20" fill="none" stroke="url(#accent-riley-bennett-egloff)" stroke-width="3"/>
  
  <!-- Inner decorative line -->
  <line x1="60" y1="128" x2="196" y2="128" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  
  <!-- Initials -->
  <text x="128" y="150" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">RBE</text>
  
  <!-- Professional accent dots -->
  <circle cx="128" cy="80" r="5" fill="#40E0D0" opacity="0.8"/>
  <circle cx="128" cy="220" r="5" fill="#FFA500" opacity="0.8"/>
  
  <!-- Corner accents -->
  <rect x="50" y="50" width="8" height="8" rx="2" fill="#40E0D0" opacity="0.5"/>
  <rect x="198" y="50" width="8" height="8" rx="2" fill="#FFA500" opacity="0.5"/>
  <rect x="50" y="198" width="8" height="8" rx="2" fill="#FFA500" opacity="0.5"/>
  <rect x="198" y="198" width="8" height="8" rx="2" fill="#40E0D0" opacity="0.5"/>
</svg>