<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-yellow-owl-workshop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="accent-yellow-owl-workshop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#40E0D0;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="40" fill="url(#bg-yellow-owl-workshop)"/>
  
  <!-- Playful shapes -->
  <circle cx="64" cy="64" r="24" fill="#40E0D0" opacity="0.6"/>
  <circle cx="192" cy="64" r="20" fill="#40E0D0" opacity="0.5"/>
  <circle cx="64" cy="192" r="18" fill="#FFA500" opacity="0.5"/>
  <circle cx="192" cy="192" r="22" fill="#40E0D0" opacity="0.6"/>
  
  <!-- Main logo area -->
  <rect x="80" y="80" width="96" height="96" rx="20" fill="#FFD700" opacity="0.9"/>
  
  <!-- Accent border -->
  <rect x="80" y="80" width="96" height="96" rx="20" fill="none" stroke="url(#accent-yellow-owl-workshop)" stroke-width="4"/>
  
  <!-- Initials -->
  <text x="128" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">YOW</text>
</svg>