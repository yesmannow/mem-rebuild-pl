<svg width="480" height="360" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Urgent Care Indy Placeholder Logo</title>
  <desc id="desc">A modern cross emblem representing an urgent care clinic, styled with the Ocean Pearl palette.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#83C5BE" />
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDDD2" />
      <stop offset="100%" stop-color="#E29578" />
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="32" fill="url(#bg)" />
  <g transform="translate(240 180)" fill="none" stroke="url(#cross)" stroke-width="32" stroke-linecap="round">
    <path d="M -70 0 H 70" />
    <path d="M 0 -70 V 70" />
  </g>
  <circle cx="240" cy="180" r="110" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="6" />
  <text x="240" y="300" text-anchor="middle" font-family="Montserrat, 'Space Grotesk', sans-serif" font-size="26" letter-spacing="0.2em" fill="#EDF6F9">
    URGENT CARE INDY
  </text>
</svg>
