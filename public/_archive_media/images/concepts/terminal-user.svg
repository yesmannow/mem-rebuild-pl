<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient-terminal-user" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#40E0D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="8" fill="#006d77" opacity="0.2"/>

  <!-- Pixelated head (8x8 grid style) -->
  <rect x="20" y="16" width="24" height="24" rx="2" fill="url(#gradient-terminal-user)" opacity="0.9"/>

  <!-- Pixelated eyes -->
  <rect x="26" y="22" width="4" height="4" fill="#40E0D0" opacity="0.8"/>
  <rect x="34" y="22" width="4" height="4" fill="#40E0D0" opacity="0.8"/>

  <!-- Pixelated mouth -->
  <rect x="28" y="30" width="8" height="2" fill="#FFA500" opacity="0.8"/>

  <!-- Pixelated body -->
  <rect x="24" y="40" width="16" height="12" rx="2" fill="url(#gradient-terminal-user)" opacity="0.7"/>

  <!-- Border -->
  <rect width="64" height="64" rx="8" fill="none" stroke="url(#gradient-terminal-user)" stroke-width="2" opacity="0.5"/>
</svg>