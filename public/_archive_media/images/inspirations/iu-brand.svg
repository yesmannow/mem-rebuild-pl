<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Black background -->
  <rect width="256" height="256" fill="#000000"/>

  <!-- IU Monogram in Crimson Red -->
  <!-- I: Vertical bar with top serif -->
  <rect x="96" y="48" width="16" height="160" fill="#990000"/>
  <rect x="88" y="48" width="32" height="8" fill="#990000"/>

  <!-- U: Wraps around bottom of I -->
  <!-- Left vertical stroke -->
  <rect x="64" y="120" width="16" height="88" fill="#990000"/>
  <!-- Right vertical stroke -->
  <rect x="144" y="120" width="16" height="88" fill="#990000"/>
  <!-- Bottom horizontal base -->
  <rect x="64" y="200" width="96" height="16" fill="#990000"/>
  <!-- Top horizontal connecting to I -->
  <rect x="64" y="120" width="96" height="8" fill="#990000"/>
</svg>

