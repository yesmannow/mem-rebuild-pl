<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="luxury-felony-case" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:0.95" />
    </linearGradient>
    <linearGradient id="gold-felony-case" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Dark background -->
  <rect width="256" height="256" fill="#000000"/>
  
  <!-- Luxury frame -->
  <rect x="32" y="32" width="192" height="192" rx="8" fill="none" stroke="url(#gold-felony-case)" stroke-width="3"/>
  <rect x="40" y="40" width="176" height="176" rx="4" fill="url(#luxury-felony-case)"/>
  
  <!-- Elegant divider -->
  <line x1="128" y1="60" x2="128" y2="196" stroke="url(#gold-felony-case)" stroke-width="2" opacity="0.6"/>
  
  <!-- Initials with luxury styling -->
  <text x="128" y="140" font-family="Georgia, serif" font-size="56" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" letter-spacing="4">FC</text>
  
  <!-- Accent dots -->
  <circle cx="128" cy="50" r="4" fill="#40E0D0" opacity="0.8"/>
  <circle cx="128" cy="206" r="4" fill="#40E0D0" opacity="0.8"/>
</svg>