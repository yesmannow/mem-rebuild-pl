<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Background with warm, earthy gradient -->
  <defs>
    <linearGradient id="folkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5DEB3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#folkGradient)"/>

  <!-- Folklorious wordmark in elegant serif -->
  <text x="128" y="140"
        font-family="Georgia, serif"
        font-size="32"
        font-weight="normal"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="2">
    Folklorious
  </text>

  <!-- Decorative accent elements suggesting eclectic design -->
  <circle cx="80" cy="80" r="8" fill="#FF6B6B" opacity="0.7"/>
  <circle cx="176" cy="80" r="8" fill="#4ECDC4" opacity="0.7"/>
  <circle cx="80" cy="176" r="8" fill="#FFE66D" opacity="0.7"/>
  <circle cx="176" cy="176" r="8" fill="#FF6B6B" opacity="0.7"/>
</svg>

