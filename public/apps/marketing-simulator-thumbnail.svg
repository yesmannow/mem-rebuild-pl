<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#40E0D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#88ABF2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#40E0D0" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#40E0D0" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#40E0D0" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#40E0D0" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#40E0D0" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#40E0D0" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#40E0D0" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#40E0D0" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#40E0D0" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#40E0D0" stroke-width="1"/>
  </g>
  
  <!-- Chart visualization mockup -->
  <g opacity="0.3">
    <!-- Bar chart -->
    <rect x="100" y="420" width="60" height="120" fill="#40E0D0" rx="4"/>
    <rect x="180" y="380" width="60" height="160" fill="#FFA500" rx="4"/>
    <rect x="260" y="450" width="60" height="90" fill="#88ABF2" rx="4"/>
    <rect x="340" y="400" width="60" height="140" fill="#EC4899" rx="4"/>
    <rect x="420" y="440" width="60" height="100" fill="#10B981" rx="4"/>
    
    <!-- Line chart -->
    <polyline points="550,500 650,450 750,480 850,400 950,420 1050,350" 
              stroke="#40E0D0" stroke-width="3" fill="none"/>
    <circle cx="550" cy="500" r="6" fill="#40E0D0"/>
    <circle cx="650" cy="450" r="6" fill="#40E0D0"/>
    <circle cx="750" cy="480" r="6" fill="#40E0D0"/>
    <circle cx="850" cy="400" r="6" fill="#40E0D0"/>
    <circle cx="950" cy="420" r="6" fill="#40E0D0"/>
    <circle cx="1050" cy="350" r="6" fill="#40E0D0"/>
  </g>
  
  <!-- Icon -->
  <circle cx="150" cy="150" r="60" fill="url(#accentGradient)" opacity="0.2"/>
  <text x="150" y="170" font-family="Arial, sans-serif" font-size="60" text-anchor="middle" fill="#40E0D0">🎯</text>
  
  <!-- Title -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="64" font-weight="bold" text-anchor="middle" fill="#E2E8F0">
    Marketing Simulator
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#94A3B8">
    Scenario Planning • Budget Modeling • Pipeline Optimization
  </text>
  
  <!-- Feature badges -->
  <g transform="translate(200, 300)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#40E0D0" opacity="0.2"/>
    <text x="90" y="27" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#40E0D0">Budget Planner</text>
  </g>
  
  <g transform="translate(410, 300)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#FFA500" opacity="0.2"/>
    <text x="90" y="27" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#FFA500">Media Mix</text>
  </g>
  
  <g transform="translate(620, 300)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#88ABF2" opacity="0.2"/>
    <text x="90" y="27" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#88ABF2">Pipeline</text>
  </g>
  
  <g transform="translate(830, 300)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#10B981" opacity="0.2"/>
    <text x="90" y="27" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#10B981">Burn Rate</text>
  </g>
</svg>
