<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo coming soon</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(64, 224, 208, 0.08), transparent 40%),
                  radial-gradient(circle at 80% 10%, rgba(88, 166, 255, 0.08), transparent 40%),
                  #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
    }
    .card {
      max-width: 680px;
      padding: 32px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(64, 224, 208, 0.25);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 8px 0;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(64, 224, 208, 0.5);
      color: #40e0d0;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .link:hover {
      background: rgba(64, 224, 208, 0.1);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Demo coming soon</h1>
    <p>This interactive demo isn’t available yet on the new domain, but it’s on the migration list.</p>
    <p>If you need a preview now, please reach out and I’ll send a direct link or recording.</p>
    <a class="link" href="mailto:jacob@bearcavemarketing.com">Contact Jacob →</a>
  </div>
</body>
</html>
