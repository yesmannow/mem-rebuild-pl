name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      PREBUILD_PIPELINE: off
      CI: true
      PUPPETEER_SKIP_DOWNLOAD: true
      SKIP_IMAGE_BUILD: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Lint
        run: npm run lint
      
      - name: Type check
        run: npm run typecheck
      
      - name: Token check (design system)
        run: node scripts/ban-raw-colors.mjs
      
      - name: Build
        run: npm run build
      
      - name: Check bundle for issues
        run: bash .github/actions/check-ce.sh dist || true
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

